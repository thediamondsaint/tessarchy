LABEL tessarchy-netinstall
TEXT HELP
Connect to a network, then install Tessarchy onto a selected disk.
The installer confirms the target before it erases any data.
ENDTEXT
MENU LABEL ^Tessarchy network installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
