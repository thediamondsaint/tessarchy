SERIAL 0 115200
UI vesamenu.c32
MENU TITLE Tessarchy

# mkarchiso installs only *.cfg from the profile's syslinux directory and one
# menu background named exactly "splash.png" — any other image there is dropped
# silently, which is how the first branded build shipped a text-only menu.
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 7
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32

# Tessarchy palette: mint (#90deca) on deep navy (#081321), the same
# pair the Plymouth splash and the shell use. Alpha 00 lets the background
# artwork show through the menu text.
MENU COLOR border       30;44   #00ffffff #00081321 std
MENU COLOR title        1;36;44 #ff90deca #00081321 std
MENU COLOR sel          7;37;40 #ff081321 #c090deca all
MENU COLOR unsel        37;44   #ffb5d9cf #00081321 std
MENU COLOR help         37;40   #ff9fc4bb #00081321 std
MENU COLOR timeout_msg  37;40   #8089b0a6 #00081321 std
MENU COLOR timeout      1;37;40 #ff90deca #00081321 std
MENU COLOR msg07        37;40   #809ab8b0 #00081321 std
MENU COLOR tabmsg       31;40   #8089b0a6 #00081321 std

MENU CLEAR
MENU IMMEDIATE
