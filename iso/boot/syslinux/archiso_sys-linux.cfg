LABEL arch
TEXT HELP
Start the Tessarchy live image on BIOS.
It boots the Tessa shell, so you can try the hardware first. Then run
    sudo tessarchy-install --check
to judge the fit, or
    sudo tessarchy-install --disk /dev/sda
to copy this system onto an internal disk.
ENDTEXT
MENU LABEL ^Tessarchy live image (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Start the Tessarchy live image on BIOS with the speakup screen reader.
The same system, with speech feedback from the first second of boot.
ENDTEXT
MENU LABEL Tessarchy live image (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
