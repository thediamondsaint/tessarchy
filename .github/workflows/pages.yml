name: Project website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/screenshots/**'
      - 'assets/roadmap/**'
      - 'shell/**'
      - 'session/**'
      - 'packaging/**'
      - 'iso/airootfs/etc/pacman.d/**'
      - 'docs/**'
      - 'Operation-TESSARCHY.md'
      - 'README.md'
      - 'scripts/build-site.py'
      - 'scripts/build-packages.sh'
      - 'scripts/package.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  packages:
    # Installed machines update from this repository, so it is built and served
    # beside the site: same origin, same deployment.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the package repository in a disposable Arch container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --privileged --rm \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env "GITHUB_SHA=$GITHUB_SHA" \
            archlinux:base bash -euo pipefail -c '
              # The bootsplash package renders its frames at build time, so
              # ffmpeg has to be here exactly as it is in the ISO job.
              pacman -Syu --noconfirm --needed base-devel ffmpeg gtk3 glib2
              useradd -m builder
              chown -R builder /workspace
              su builder -c "./scripts/build-packages.sh"
            '
          test -f dist/repo/x86_64/repo-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: tessarchy-pkgs-${{ github.run_number }}
          path: dist/repo/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: packages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api repos/${{ github.repository }}/releases > build/releases.json
      - name: Build site from repository assets
        run: python3 scripts/build-site.py --output dist/website --releases build/releases.json
      - uses: actions/download-artifact@v4
        with:
          name: tessarchy-pkgs-${{ github.run_number }}
          path: dist/website/pkgs
      - name: Confirm the update repository is part of the site
        run: |
          set -euo pipefail
          ls -l dist/website/pkgs/x86_64
          python3 -c "
          import json, pathlib
          info = json.loads(pathlib.Path('dist/website/pkgs/x86_64/repo-info.json').read_text())
          print(info['version'], info['commit'], len(info['packages']), 'packages')
          assert pathlib.Path('dist/website/pkgs/x86_64/tessarchy.db.tar.gz').is_file()
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website
      - uses: actions/deploy-pages@v4
        id: deployment
