name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-nm-1.0 dbus-daemon lua5.4 fish shellcheck ffmpeg libqt6svg6 \
            qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-templates \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick-window \
            qml6-module-qttest desktop-file-utils
      - name: Run source checks
        run: ./scripts/check.sh

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install target toolchain in the disposable CI container
        run: |
          pacman -Syu --noconfirm --needed git python python-gobject libnm dbus lua fish shellcheck ffmpeg \
            qt6-declarative quickshell hyprland desktop-file-utils ttf-dejavu
          useradd --create-home checker
      - uses: actions/checkout@v4
      - name: Give the build user ownership of the checkout
        run: chown -R checker:checker "$GITHUB_WORKSPACE"
      - name: Check as a non-root development user
        run: runuser -u checker -- ./scripts/check.sh
      - name: Build tablet install packages without installing them
        run: |
          runuser -u checker -- ./scripts/package.sh
          runuser -u checker -- python scripts/bundle-tablet.py --output dist/Tessarchy-Tablet-Pilot-Packages.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tablet-install-packages-${{ github.sha }}
          path: dist/Tessarchy-Tablet-Pilot-Packages.tar.gz
          if-no-files-found: error
          retention-days: 7
