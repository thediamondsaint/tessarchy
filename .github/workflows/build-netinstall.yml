name: Build Tessarchy netinstall ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional alpha tag for a draft release
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/build-netinstall.yml'
      - 'docs/netinstall.md'
      - 'iso/**'
      - 'packaging/**'
      - 'scripts/build-netinstall-iso.sh'
      - 'scripts/stage-netinstall.sh'
      - 'scripts/package.sh'
      - 'scripts/build-packages.sh'
      - 'session/**'
      - 'shell/**'

permissions:
  contents: read

jobs:
  netinstall:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source-check dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libgtk-3-dev libglib2.0-dev pkg-config qemu-system-x86 ovmf python3-pil
      - name: Check source and QML
        run: ./scripts/check.sh
      - name: Build compact ISO in Arch container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --privileged --rm \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env "TESSARCHY_COMMIT=$GITHUB_SHA" \
            archlinux:base bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed archiso base-devel ffmpeg git glib2 gtk3 pkgconf
              useradd -m builder
              chown -R builder /workspace
              su builder -c "./scripts/build-packages.sh"
              ./scripts/stage-netinstall.sh
              mkarchiso -v -w build/netinstall-work -o dist build/netinstall-profile 2>&1 | tee dist/build.log
              image=(dist/tessarchy-netinstall-*.iso)
              [[ ${#image[@]} == 1 ]]
              bytes=$(stat -c %s "${image[0]}")
              (( bytes <= 1073741824 ))
              rm -rf dist/repo
              rm -f dist/*.pkg.tar.zst dist/tessarchy-0.1.0.tar.gz dist/SOURCE.json
              printf "Commit: %s\nBuilt: %s\nISO bytes: %s\n" "$TESSARCHY_COMMIT" "$(date -u --iso-8601=seconds)" "$bytes" > dist/build-info.txt
              pacman -Q archiso >> dist/build-info.txt
              cd dist
              sha256sum tessarchy-netinstall-*.iso > SHA256SUMS
            '
      - name: Capture installer boots in diskless BIOS and UEFI VMs
        shell: bash
        run: |
          set -euo pipefail
          image=(dist/tessarchy-netinstall-*.iso)
          [[ ${#image[@]} == 1 ]]
          accel=tcg
          seconds=180
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            accel=kvm
            seconds=60
          fi
          python3 scripts/boot-test-iso.py "${image[0]}" build/netinstall-vm-bios \
            --firmware bios --accel "$accel" --seconds "$seconds" --sample-interval 5 --no-auto-enter &
          bios=$!
          python3 scripts/boot-test-iso.py "${image[0]}" build/netinstall-vm-uefi \
            --firmware uefi --accel "$accel" --seconds "$seconds" --sample-interval 5 --no-auto-enter &
          uefi=$!
          wait "$bios"
          wait "$uefi"
          cp build/netinstall-vm-bios/final.png dist/boot-bios.png
          cp build/netinstall-vm-uefi/final.png dist/boot-uefi.png
          printf '%s\n' "Diskless QEMU captures: BIOS and UEFI, $accel acceleration. Review both screenshots; capture completion alone is not a boot-success claim." > dist/VM-TESTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: tessarchy-netinstall-x86_64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft-alpha:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: netinstall
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tessarchy-netinstall-x86_64-${{ github.run_number }}
          path: dist
      - name: Verify ISO and create a draft alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9][0-9A-Za-z.-]*$ ]]
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Tessarchy $RELEASE_TAG — netinstall alpha" \
            --notes-file <(printf '%s\n' 'Compact UEFI network installer for testing. It requires an internet connection and erases the selected disk after explicit confirmation. See docs/netinstall.md for requirements and VM testing.' ) \
            tessarchy-netinstall-*.iso SHA256SUMS build-info.txt boot-bios.png boot-uefi.png VM-TESTING.md
